<title>ชุดสื่อหกเหลี่ยมสองวงกลม</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;600;700&family=IBM+Plex+Sans+Thai:wght@400;600&display=swap">
<style>
/* เลย์เอาต์: โต๊ะทำงาน ฉากจำลองเต็มกว้าง ตามด้วยแผงอธิบายทีละขั้น */
:root{
  --bg:#eef1ee;--fg:#1d2723;--muted:#56635d;--table:#d9d3c5;--board:#fbfbf8;--edge:#39453f;
  --recess:#c9c6b9;--gray:#c4c8c5;--grayline:#7b837f;--ink:#0d5c8f;--panel:#ffffff;--line:#c8d0cb;
  --display:"Anuphan","Noto Sans Thai",sans-serif;--body:"IBM Plex Sans Thai","Noto Sans Thai",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141a18;--fg:#e8ede9;--muted:#a3b0a9;--table:#2a302c;--board:#f1f1ec;--edge:#39453f;
  --recess:#c9c6b9;--gray:#c4c8c5;--grayline:#7b837f;--ink:#0d5c8f;--panel:#1d2522;--line:#37423d;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a18;--fg:#e8ede9;--muted:#a3b0a9;--table:#2a302c;--board:#f1f1ec;--edge:#39453f;
  --recess:#c9c6b9;--gray:#c4c8c5;--grayline:#7b837f;--ink:#0d5c8f;--panel:#1d2522;--line:#37423d;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:16px/1.65 var(--body)}
main{max-width:1120px;margin:auto;padding-block:24px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
h1{font:700 clamp(1.5rem,4vw,2.1rem)/1.25 var(--display);margin:0;text-wrap:balance}
header p{margin:6px 0 0;color:var(--muted);max-width:65ch}
.scene{background:var(--table);border-radius:6px;padding:10px;min-width:0}
svg{display:block;width:100%;height:auto}
.mover{transition:transform .8s cubic-bezier(.4,0,.2,1)}
.fade{transition:opacity .4s}
.plain .mover text{opacity:0}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:600 1rem var(--display);padding:9px 15px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:4px;cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
button.chip{width:42px;padding:9px 0;font-variant-numeric:tabular-nums}
button.chip[aria-current="step"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.spacer{flex:1}
.note{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:16px 18px;min-width:0}
.note h2{font:700 1.25rem/1.35 var(--display);margin:0 0 4px}
.note p{margin:0;max-width:70ch}
.eq{display:block;margin-top:8px;font:600 1.1rem var(--display);font-variant-numeric:tabular-nums}
footer{color:var(--muted);font-size:.9rem;max-width:75ch}
@media (prefers-reduced-motion:reduce){.mover,.fade{transition:none}}
</style>

<main>
  <header>
    <h1>ชุดสื่อมุมภายในหกเหลี่ยมกับวงกลม 2 วง</h1>
    <p>กดทีละขั้นเพื่อดูชิ้นส่วนเคลื่อนที่ รูปคำนวณจากขนาดจริง: หกเหลี่ยมด้าน 16 ซม. ชิ้นมุมรัศมี 8 ซม. บนแผ่น A3</p>
  </header>
  <div class="scene"><svg id="s" role="img" aria-label="แผ่นหกเหลี่ยมและแผ่นวงกลม 2 วง พร้อมชิ้นมุมที่เคลื่อนตามขั้นตอน"></svg></div>
  <div class="controls">
    <button id="prev">ย้อนกลับ</button>
    <span id="chips" class="controls"></span>
    <span class="spacer"></span>
    <button id="next">ขั้นถัดไป</button>
  </div>
  <section class="note" aria-live="polite"><h2 id="t"></h2><p id="d"></p><span class="eq" id="e"></span></section>
  <footer>พื้นที่สีขาวระหว่างชิ้นเป็นแบบที่ตั้งใจไว้ เพราะชิ้นมุมและวงกลางไม่ได้ปูเต็มหกเหลี่ยม ขนาดทั้งหมดเป็นการคำนวณ ยังไม่เคยทดลองทำจริง</footer>
</main>

<script>
const NS='http://www.w3.org/2000/svg',S=16,R=8,BW=42,BH=29.7;
const rad=d=>d*Math.PI/180,pol=(r,a)=>[r*Math.cos(rad(a)),r*Math.sin(rad(a))];
const svg=document.getElementById('s');
const el=(n,a={},p=svg)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e};
const css=v=>`var(--${v})`;
function sector(r,a0,a1){const[x0,y0]=pol(r,a0),[x1,y1]=pol(r,a1);return`M0 0L${x0} ${y0}A${r} ${r} 0 0 1 ${x1} ${y1}Z`}

/* มุมของจุดยอดนับตามเข็มนาฬิกาจากซ้ายบน · ชิ้นมุมวางปลายบนจุดยอด หันเข้าหาจุดศูนย์กลาง */
const TH=[-120,-60,0,60,120,180];
const COL=['#e4483a','#1f8fd0','#f59a2e','#58b96a','#ee7fc4','#9b72cf'];
const CX=BW/2,CY=BH/2;
const V=TH.map(a=>{const[x,y]=pol(S,a);return[CX+x,CY+y]});

let off=[45,0];
const b1=el('g'),b2=el('g');
const hexPts=V.map(p=>p.join(',')).join(' ');
el('rect',{width:BW,height:BH,rx:.4,fill:css('board'),stroke:'#a9b0ab','stroke-width':.1},b1);
el('polygon',{points:hexPts,fill:'none',stroke:css('edge'),'stroke-width':.16},b1);
el('circle',{cx:CX,cy:CY,r:R,fill:css('recess')},b1);
TH.forEach((a,i)=>{const g=el('g',{transform:`translate(${V[i]})`},b1);el('path',{d:sector(R,a+120,a+240),fill:css('recess')},g)});

el('rect',{width:BW,height:BH,rx:.4,fill:css('board'),stroke:'#a9b0ab','stroke-width':.1},b2);
const C=[[10.5,CY],[31.5,CY]];
[[0,120,240],[60,180,300]].forEach((sp,i)=>{
  el('circle',{cx:C[i][0],cy:C[i][1],r:R,fill:css('recess')},b2);
  sp.forEach(a=>{const[x,y]=pol(R,a);el('line',{x1:C[i][0],y1:C[i][1],x2:C[i][0]+x,y2:C[i][1]+y,stroke:css('grayline'),'stroke-width':.08},b2)});
  el('text',{x:C[i][0],y:C[i][1]+R+1.55,'text-anchor':'middle','font-size':1.25,'font-weight':600,fill:'#39453f','font-family':'Anuphan,sans-serif'},b2).textContent=`วงที่ ${i+1} = 360°`;
});

/* ชิ้นสีเทา 60° วาดรอบจุดปลาย (0,0) แล้วเลื่อนด้วย translate */
const grays=[];
for(let i=0;i<6;i++){
  const a=-120+60*i,g=el('g',{class:'mover'});
  el('path',{d:sector(R,a,a+60),fill:css('gray'),stroke:css('grayline'),'stroke-width':.08},g);
  const[x,y]=pol(5.6,a+30);
  el('text',{x,y:y+.4,'text-anchor':'middle','font-size':1.1,fill:'#2b3430','font-family':'Anuphan,sans-serif'},g).textContent='60°';
  grays.push(g);
}
const pieces=TH.map((a,i)=>{
  const g=el('g',{class:'mover'});
  el('path',{d:sector(R,a+120,a+240),fill:COL[i],stroke:'#2b3430','stroke-width':.08},g);
  const[x,y]=pol(3.9,a+180),[lx,ly]=pol(6.3,a+180);
  el('text',{x,y:y+.9,'text-anchor':'middle','font-size':2.5,'font-weight':700,fill:'#14191a','font-family':'Anuphan,sans-serif'},g).textContent=i+1;
  el('text',{x:lx,y:ly+.4,'text-anchor':'middle','font-size':1,fill:'#14191a','font-family':'Anuphan,sans-serif'},g).textContent='120°';
  return g;
});

/* แผ่นใส: เส้นจากจุดศูนย์กลาง และเส้นทแยงจากจุดยอดเดียว */
const spokes=el('g',{class:'fade',opacity:0}),diag=el('g',{class:'fade',opacity:0});
V.forEach(p=>el('line',{x1:CX,y1:CY,x2:p[0],y2:p[1],stroke:css('ink'),'stroke-width':.16,'stroke-dasharray':'.6 .35'},spokes));
[2,3,4].forEach(i=>el('line',{x1:V[0][0],y1:V[0][1],x2:V[i][0],y2:V[i][1],stroke:css('ink'),'stroke-width':.18},diag));
[[0,1,2],[0,2,3],[0,3,4],[0,4,5]].forEach((t,i)=>{
  const x=(V[t[0]][0]+V[t[1]][0]+V[t[2]][0])/3,y=(V[t[0]][1]+V[t[1]][1]+V[t[2]][1])/3;
  el('circle',{cx:x,cy:y,r:1.25,fill:css('ink')},diag);
  el('text',{x,y:y+.5,'text-anchor':'middle','font-size':1.4,'font-weight':700,fill:'#fff','font-family':'Anuphan,sans-serif'},diag).textContent=i+1;
});

const O='center',H='home',Ci='circle';
const STEPS=[
 {t:'ชุดสื่อพร้อมใช้',d:'ชิ้นมุม 120° อยู่ที่มุมหกเหลี่ยม 6 ชิ้น สีอุ่นกับสีเย็นสลับกัน ตรงกลางคือชิ้น 60° จำนวน 6 ชิ้น',e:'มุมภายใน 120° × 6 · มุมที่ศูนย์กลาง 60° × 6',p:[H,H,H,H,H,H]},
 {t:'วางแผ่นใส เห็นสามเหลี่ยมด้านเท่า 6 รูป',d:'เส้นประแบ่งมุมภายในแต่ละมุมออกเป็น 2 ส่วนเท่ากัน และแบ่งวงกลางเป็น 6 ส่วน',e:'120° = 60° + 60°',p:[H,H,H,H,H,H],sp:1},
 {t:'ทาบมุม 1 บนวงกลาง',d:'เลื่อนชิ้นมุม 1 มาวางให้ปลายอยู่ที่จุดศูนย์กลาง ชิ้นจะทับชิ้น 60° พอดี 2 ชิ้น',e:'มุมภายใน = 2 เท่าของมุมที่ศูนย์กลาง',p:[O,H,H,H,H,H]},
 {t:'มุม 1, 3, 5 ต่อเป็นวงที่ 1',d:'ย้ายชิ้นสีอุ่นทั้ง 3 ไปต่อกันโดยไม่ต้องหมุน ปลายมุมมาชนกันที่จุดเดียวพอดี',e:'120° × 3 = 360°',p:[Ci,H,Ci,H,Ci,H]},
 {t:'มุม 2, 4, 6 ต่อเป็นวงที่ 2',d:'ย้ายชิ้นสีเย็นทั้ง 3 ตามไป ทั้ง 6 มุมจึงกลายเป็นวงกลม 2 วงเต็ม',e:'360° + 360° = 720° = ผลรวมมุมภายในหกเหลี่ยม',p:[Ci,Ci,Ci,Ci,Ci,Ci]},
 {t:'ถ้ามีวงกลมวงเดียวจะพอไหม',d:'แบ่ง 1 วงเป็น 6 ชิ้นได้ชิ้นละ 60° ลองวางชิ้นสีเทาในช่องมุม 1 จะเต็มแค่ครึ่งช่อง',e:'60° ไม่พอ ต้องแบ่งวงละ 3 ชิ้น ได้ชิ้นละ 120° และใช้ 2 วง',p:[Ci,Ci,Ci,Ci,Ci,Ci],g:1},
 {t:'คืนรูป แล้วนับสามเหลี่ยม',d:'ย้ายชิ้นกลับครบ 6 มุม แล้วลากเส้นทแยงจากจุดยอดเดียว ได้สามเหลี่ยม 4 รูป ทุก 2 รูปมีมุมรวม 360°',e:'สี่เหลี่ยม 2 รูป = 1 วง · หกเหลี่ยม 4 รูป = 2 วง',p:[H,H,H,H,H,H],dg:1},
];
const chips=document.getElementById('chips');
const btn=STEPS.map((_,i)=>{const b=document.createElement('button');b.className='chip';b.textContent=i+1;b.setAttribute('aria-label','ขั้นที่ '+(i+1));b.onclick=()=>go(i);chips.appendChild(b);return b});
let cur=0;
const tr=(g,x,y)=>g.style.transform=`translate(${x}px,${y}px)`;
function place(){
  const wide=innerWidth>=720;off=wide?[45,0]:[0,32];
  svg.setAttribute('viewBox',wide?`-.5 -.5 ${87+1} ${BH+1}`:`-.5 -.5 ${BW+1} ${BH*2+2.3+1}`);
  b2.setAttribute('transform',`translate(${off})`);
  const s=STEPS[cur];
  grays.forEach((g,i)=>{ if(s.g&&i===3) tr(g,V[0][0],V[0][1]); else tr(g,CX,CY)});
  pieces.forEach((g,i)=>{
    const m=s.p[i];
    if(m===H) tr(g,V[i][0],V[i][1]);
    else if(m===O) tr(g,CX,CY);
    else{const c=C[i%2];tr(g,c[0]+off[0],c[1]+off[1])}
  });
  svg.classList.toggle('plain',!!s.dg);spokes.setAttribute('opacity',s.sp?1:0);diag.setAttribute('opacity',s.dg?1:0);
}
function go(i){
  cur=Math.max(0,Math.min(STEPS.length-1,i));const s=STEPS[cur];
  t.textContent=`ขั้นที่ ${cur+1}: ${s.t}`;d.textContent=s.d;e.textContent=s.e;
  btn.forEach((b,j)=>j===cur?b.setAttribute('aria-current','step'):b.removeAttribute('aria-current'));
  prev.disabled=cur===0;next.disabled=cur===STEPS.length-1;
  try{history.replaceState(null,'','#s'+(cur+1))}catch(_){}
  place();
}
const t=document.getElementById('t'),d=document.getElementById('d'),e=document.getElementById('e'),prev=document.getElementById('prev'),next=document.getElementById('next');
prev.onclick=()=>go(cur-1);next.onclick=()=>go(cur+1);
addEventListener('resize',place);
addEventListener('keydown',ev=>{if(ev.key==='ArrowRight')go(cur+1);if(ev.key==='ArrowLeft')go(cur-1)});
const h=/^#s(\d)$/.exec(location.hash);go(h?+h[1]-1:0);
</script>
